name: Build

# Publish a multi-arch container image to GHCR.
#
# Each architecture is built on a NATIVE GitHub-hosted runner — no QEMU:
#   linux/amd64 -> ubuntu-latest
#   linux/arm64 -> ubuntu-24.04-arm (free for public repositories)
#
# Per-arch builds push temporary tags (:sha-amd64 / :sha-arm64); the merge job
# stitches them into the final manifest:
#   - :<commit-sha>  (immutable)
#   - :latest        (mutable, updated on every main build)
#
# Production can either build locally (`docker compose build`, the default in
# docker-compose.yml) or pull this image by setting AGY_IMAGE in .env.

on:
  workflow_dispatch:
  push:
    branches: [main]

env:
  REGISTRY: ghcr.io
  OWNER: ozanonurtek
  SERVICE: antigravity-proxy

jobs:
  build:
    runs-on: ${{ matrix.arch.runner }}
    permissions:
      contents: read
      packages: write

    strategy:
      matrix:
        arch:
          - { arch: amd64, platform: linux/amd64, runner: ubuntu-latest }
          - { arch: arm64, platform: linux/arm64, runner: ubuntu-24.04-arm }

    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push (${{ matrix.arch.arch }})
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          platforms: ${{ matrix.arch.platform }}
          tags: ${{ env.REGISTRY }}/${{ env.OWNER }}/${{ env.SERVICE }}:${{ github.sha }}-${{ matrix.arch.arch }}
          cache-from: type=gha,scope=${{ matrix.arch.arch }}
          cache-to: type=gha,mode=max,scope=${{ matrix.arch.arch }}

  merge:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Merge amd64 + arm64 manifests
        run: |
          IMAGE="${REGISTRY}/${OWNER}/${SERVICE}"
          docker buildx imagetools create \
            --tag "${IMAGE}:latest" \
            --tag "${IMAGE}:${GITHUB_SHA}" \
            "${IMAGE}:${GITHUB_SHA}-amd64" \
            "${IMAGE}:${GITHUB_SHA}-arm64"
          docker buildx imagetools inspect "${IMAGE}:latest"
