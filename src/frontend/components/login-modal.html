<div id="login-modal" class="hidden fixed inset-0 bg-black/80 backdrop-blur-md z-50 flex items-center justify-center p-4 transition-colors font-mono">
    <div class="bg-white dark:bg-[#050505] rounded-xl shadow-2xl max-w-md w-full border border-zinc-200 dark:border-zinc-800 p-8 transition-colors">
        <div class="flex flex-col items-center text-center mb-6">
            <div class="w-12 h-12 rounded-lg border border-zinc-200 dark:border-zinc-800 bg-zinc-50 dark:bg-zinc-900 text-zinc-900 dark:text-white font-bold text-2xl flex items-center justify-center mb-3 shadow-inner">
                A
            </div>
            <h2 class="text-xl font-bold text-zinc-900 dark:text-white tracking-tight">Antigravity Console</h2>
            <p class="text-xs text-zinc-500 dark:text-zinc-400 mt-1">Authentication required to access management dashboard</p>
        </div>

        <form id="login-form" onsubmit="handleLoginSubmit(event)" class="space-y-4">
            <div>
                <label for="login-password" class="block text-[10px] font-bold text-zinc-500 dark:text-zinc-400 uppercase tracking-wider mb-2">Web Password</label>
                <div class="relative">
                    <input type="password" id="login-password" required placeholder="Enter password..." autocomplete="current-password"
                        class="w-full px-4 py-2.5 text-sm border border-zinc-200 dark:border-zinc-800 rounded-lg bg-zinc-50 dark:bg-zinc-900/50 text-zinc-900 dark:text-white focus:border-emerald-500 dark:focus:border-emerald-500 focus:outline-none transition-colors pr-10 font-mono" />
                    <button type="button" onclick="togglePasswordVisibility()" class="absolute right-3 top-1/2 -translate-y-1/2 text-zinc-400 hover:text-zinc-600 dark:hover:text-zinc-300">
                        <svg id="eye-icon" class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"/><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z"/></svg>
                    </button>
                </div>
            </div>

            <div id="login-error" class="hidden text-xs text-rose-500 dark:text-rose-400 bg-rose-50 dark:bg-rose-950/40 border border-rose-200 dark:border-rose-900/50 p-2.5 rounded-lg text-center font-medium">
            </div>

            <button type="submit" id="login-btn" class="w-full py-2.5 px-4 text-xs font-bold text-white dark:text-black bg-zinc-900 dark:bg-white hover:bg-zinc-800 dark:hover:bg-zinc-200 rounded-lg transition-all uppercase tracking-wider shadow-sm flex items-center justify-center gap-2">
                <span>Unlock Console</span>
                <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M14 5l7 7m0 0l-7 7m7-7H3"/></svg>
            </button>
        </form>
    </div>
</div>
